# =============================================================================
# Maps of Making — internal nginx
# Serves static files from web/ and proxies SPARQL to oxigraph.
# This nginx sits behind hetzner-gateway; no TLS needed here.
# =============================================================================

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s ipv6=off;

    access_log /var/log/nginx/maps_access.log combined;
    error_log  /var/log/nginx/maps_error.log;

    # ── Static map app ───────────────────────────────────────────────────────
    root  /var/www/mapsofmaking;
    index maps-of-making.html;

    location / {
        try_files $uri $uri/ =404;
        # PMTiles: range requests required by MapLibre PMTiles protocol
        add_header Accept-Ranges bytes always;
        # Revalidate app shell (html/js) every load so deployed fixes reach returning
        # visitors without a hard refresh. ETag → cheap 304 when unchanged.
        add_header Cache-Control "no-cache" always;
    }

    # ── Data files (materialized GeoJSON) ────────────────────────────────────
    location /data/ {
        try_files $uri =404;
        # Revalidate on every request — stale cache causes "all broken" on revisit
        add_header Cache-Control "no-cache" always;
    }

    # ── SPARQL endpoint (Oxigraph) ───────────────────────────────────────────
    # SPARQL read (public)
    location /sparql/query {
        proxy_pass http://oxigraph:7878/query;
        add_header Access-Control-Allow-Origin "*" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # SPARQL update (blocked) — OPTIONS preflight allowed for CORS, all other methods denied
    location /sparql/update {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        deny all;
        return 403;
    }

    # ── Magic link handler (mak-link-handler FastAPI) ──────────────────────────
    location /claim/ {
        proxy_pass http://mak-link-handler:8000/claim/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Coordinator URL onboarding API (mak-link-handler FastAPI) ─────────────
    # Snapshots endpoint (regex, takes precedence over /api/ prefix)
    location ~ ^/api/space/[^/]+/snapshots$ {
        proxy_pass http://mak-link-handler:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # Raw endpoint (regex, takes precedence over /api/ prefix)
    location ~ ^/api/space/[^/]+/raw$ {
        proxy_pass http://mak-link-handler:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location /api/ {
        proxy_pass http://mak-link-handler:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 60s: headroom for the Oxigraph-backed endpoints this block actually serves
        # — /api/heartbeat-space/{id} and /api/rematerialize, which fan out to a
        # whole-corpus query. NOT /api/space/{id}/raw or /snapshots: those are regex
        # locations above, and a regex match always beats this prefix match, so they
        # keep their own 15s/10s ceilings regardless of what is set here.
        # Belt-and-braces only — register-url now answers before its slow tail.
        proxy_read_timeout 60s;
    }

    # ── Webhook: presence (Epic 7 slot, deferred) ─────────────────────────────
    # location /webhook/presence {
    #     proxy_pass http://mak-agent:9000/presence;
    # }

    # ── Bernard's Workshop (Epic 9) ──────────────────────────────────────────
    # Use `index index.html` + `try_files $uri $uri/` — do NOT put index.html as
    # the last try_files arg: nginx would then resolve every response's
    # Content-Type from .html, serving .js as text/html (blocked by nosniff).
    # The `index` directive handles the directory root with correct MIME.
    location /genjson/ {
        index index.html;
        try_files $uri $uri/ =404;
        add_header Accept-Ranges bytes always;
    }

    # ── Mother Sands website ─────────────────────────────────────────────────
    location /mothersands/ {
        index index.html;
        try_files $uri $uri/ =404;
        add_header Accept-Ranges bytes always;
    }

    # ── Admin area (Epic 4) ──────────────────────────────────────────────────
    location /admin/ {
        auth_basic "Maps Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
