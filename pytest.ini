[pytest]
# Story 3.4b clean-slate pivot — the default test run reflects the SUPPORTED
# clean path only. Legacy tests (transformer/heartbeat tangle that Story 3.5
# rewrites) are quarantined behind the `legacy` marker and deselected here.
#
#   pytest                — clean path + guardrails (the green bar that matters)
#   pytest -m legacy      — the 3.5-rewrite safety net, on demand
#   pytest -m ""          — everything
#
# Archived tests (genuinely dead code) live in tests/archive/ and are never
# collected — see tests/archive/README.md.

addopts = -m "not legacy"

markers =
    legacy: pins code retired or rewritten by the clean-slate pivot (Story 3.4b/3.5)
    network: tests requiring live network access (Oxigraph + external endpoints)
    live_integration: tests requiring live Oxigraph at localhost:7878
    live: tests requiring the full podman stack running (nginx + mak-link-handler)

norecursedirs = .git venv .claude tests/archive *.egg node_modules

asyncio_mode = strict
